# Kafka 4.x KRaft combined broker/controller reference config.
# docker-compose.yml currently configures the container through environment variables;
# keep this file aligned if you later switch to mounting server.properties.
node.id=3
process.roles=broker,controller
controller.quorum.voters=1@kafka0:9094,2@kafka1:9094,3@kafka2:9094

listeners=INTERNAL://:9092,CONTROLLER://:9094,EXTERNAL://:9093
advertised.listeners=INTERNAL://kafka2:9092,EXTERNAL://localhost:9095
listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

log.dirs=/tmp/kraft-combined-logs
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=true
