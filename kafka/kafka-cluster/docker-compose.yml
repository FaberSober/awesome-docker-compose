services:
  kafka0:
    image: apache/kafka:4.1.2
    container_name: kafka0
    hostname: kafka0
    ports:
      - "9093:9093"
    volumes:
      - "./data/kafka0:/tmp/kraft-combined-logs"
    environment:
      # =========================
      # 基础节点配置
      # =========================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      # 三个 Kafka 节点同时作为 controller，组成 KRaft 元数据仲裁集群
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka0:9094,2@kafka1:9094,3@kafka2:9094"

      # =========================
      # 监听器配置
      # =========================
      # INTERNAL: Docker 网络内部访问
      # CONTROLLER: KRaft controller 内部通信
      # EXTERNAL: 宿主机/局域网客户端访问
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9094,EXTERNAL://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka0:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"

      # broker 之间通信使用 INTERNAL
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # controller 通信使用 CONTROLLER
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # =========================
      # KRaft 集群 ID
      # 三个节点必须完全一致
      # 已有数据目录后不要随意修改
      # =========================
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # =========================
      # Topic / 事务 / 消费位移配置
      # =========================
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 开发测试环境可以开启；生产环境建议关闭
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # 日志目录
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    networks:
      - kafka

  kafka1:
    image: apache/kafka:4.1.2
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9094:9093"
    volumes:
      - "./data/kafka1:/tmp/kraft-combined-logs"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka0:9094,2@kafka1:9094,3@kafka2:9094"

      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9094,EXTERNAL://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    networks:
      - kafka

  kafka2:
    image: apache/kafka:4.1.2
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9095:9093"
    volumes:
      - "./data/kafka2:/tmp/kraft-combined-logs"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka0:9094,2@kafka1:9094,3@kafka2:9094"

      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9094,EXTERNAL://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9095"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    networks:
      - kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka0
      - kafka1
      - kafka2
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "local-kafka-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka0:9092,kafka1:9092,kafka2:9092"
    networks:
      - kafka

networks:
  kafka:
    driver: bridge
